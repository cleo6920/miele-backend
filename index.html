<style>
/* ===== Subtle background & motion utilities (non-breaking) ===== */
html { scroll-behavior: smooth; }
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:-1;
  background:
    radial-gradient(1200px 600px at var(--mx, 10%) var(--my, 0%), rgba(255,247,230,.35), transparent 70%),
    linear-gradient(180deg, rgba(255,250,241,.6), rgba(255,247,230,.6));
}
body::after{
  content:"";
  position:fixed; inset:0; pointer-events:none; z-index:-1; opacity:.06; mix-blend:multiply;
  background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(%23n)" opacity="0.35"/></svg>');
}

/* Reveal on scroll */
.reveal-up{ opacity:0; transform:translateY(16px); transition:opacity .6s ease, transform .6s ease; }
.reveal-up.is-visible{ opacity:1; transform:none; }
.reveal-fade{ opacity:0; transition:opacity .8s ease; }
.reveal-fade.is-visible{ opacity:1; }

/* Hover micro-tilt (optional utility) */
.hover-tilt{ transition: transform .3s ease, box-shadow .3s ease; }
.hover-tilt:hover{ transform: translateY(-4px) scale(1.01); box-shadow: 0 14px 36px rgba(245,158,11,.18); }

/* Respect reduced-motion */
@media (prefers-reduced-motion: reduce){
  .reveal-up, .reveal-fade{ transition:none; transform:none!important; opacity:1!important; }
}
</style>

// ======= GlobalProductSearch (integrato) =======
function GlobalProductSearch({ allProducts, onProductSelect }) {
  const [q, setQ] = useState("");
  const [sugg, setSugg] = useState([]);
    const stopWords = new Set(['a','alle','allo','ai','agli','al','con','dal','dalle','dallo','dai','dagli','del','della','dello','dei','degli','di','e','il','la','le','lo','gli','in','nel','nella','nello','nei','negli','su','un','una','uno','per']);
const wrapRef = useRef(null);

  useEffect(() => {
    const onClick = (e) => {
      if (wrapRef.current && !wrapRef.current.contains(e.target)) setSugg([]);
    };
    document.addEventListener("mousedown", onClick);
    return () => document.removeEventListener("mousedown", onClick);
  }, []);

  
  const onChange = (e) => {
    const v = e.target.value;
    setQ(v);
    const val = (v || "").trim().toLowerCase();
    if (val.length > 2) {
      const keywords = val.split(/\s+/).filter(w => w && !stopWords.has(w));
      if (keywords.length) {
        const out = (allProducts || [])
          .filter(p => {
            const searchableText = `${(p.name||"").toLowerCase()} ${(p.description||"").toLowerCase()} ${(p.category||"").toLowerCase()}`;
            return keywords.every(kw => searchableText.includes(kw));
          })
          .sort((a,b) => (a.name||"").localeCompare(b.name||""))
          .slice(0, 20);
        setSugg(out);
      } else {
        setSugg([]);
      }
    } else {
      setSugg([]);
    }
  };


  const select = (id) => {
    setQ("");
    setSugg([]);

        function deduceProvFromCap(cap) {
            if (!/^\d{5}$/.test(cap)) return undefined;
            for (const n of [5, 4, 3]) {
                const pref = cap.slice(0, n);
                if (CAP_TO_PROV[pref]) return CAP_TO_PROV[pref];
            }
            return undefined;

        function normalizePhoneUtil(raw) { // Rinominato per evitare conflitto con stato `phone`
            if (!raw) return '';
            let s = String(raw).trim();
            if (s.startsWith('00')) s = '+' + s.slice(2);
            s = s.replace(/(?!^\+)[^\d]/g, '');
            if (s.startsWith('+')) return s;
            return '+39' + s.replace(/[^\d]/g, '');

                if (!selectedPack) {

                    return;

                const totalJarsRequested = quantity * selectedPack.jars;
                let jarsInCartAlreadyEquivalent = 0;
                const existingCartItem = cartItems.find(item => item.productId === productId && item.packId === packId);
                if (existingCartItem) {
                    const existingPack = productToAdd.packs.find(p => p.id === existingCartItem.packId);
                    jarsInCartAlreadyEquivalent = existingCartItem.quantity * existingPack.jars;
                }
                const newTotalJarsInCartEquivalent = jarsInCartAlreadyEquivalent + totalJarsRequested;
                if (productToAdd.stock < newTotalJarsInCartEquivalent) {
                    showNotification(`⚠️ Stock insufficiente per "${productToAdd.name}".`, "error");
                    return;
                }
                setCartItems(prevItems => {
                    const existingItemIndex = prevItems.findIndex(item => item.productId === productId && item.packId === packId);
                    if (existingItemIndex > -1) {
                        const newItems = [...prevItems];
                        newItems[existingItemIndex].quantity += quantity;

                setCartItems(prevItems => prevItems.map(item =>

            const calculateCartTotals = useMemo(() => {

                const detailedCartItems = cartItems.map(getCartItemDetails).filter(Boolean);
                const incartateItems = detailedCartItems.filter(i => i.productId === 'caramelle-incartate-70g');
                const incartateBuste = incartateItems.reduce((sum, i) => sum + i.totalItemJars, 0);
                const incartateDiscountActive = incartateBuste >= 5;
                const burroItems = detailedCartItems.filter(i => i.productId === 'burro-cacao');
                const burroUnits = burroItems.reduce((sum, i) => sum + i.totalItemJars, 0);
                const burroDiscountActive = burroUnits >= 4;
                const saponetteItems = detailedCartItems.filter(i => i.productId === 'saponette-artigianali');
                const saponetteUnits = saponetteItems.reduce((sum, i) => sum + i.totalItemJars, 0);
                const saponetteDiscountActive = saponetteUnits >= 6;
                detailedCartItems.forEach(item => {
                    const baseLine = item.totalItemPrice;
                    let discountedLine = baseLine;
                    if (item.productId === 'caramelle-incartate-70g' && incartateDiscountActive) discountedLine = baseLine * (1 - 0.13);
                    if (item.productId === 'burro-cacao' && burroDiscountActive) discountedLine = baseLine * (1 - 0.0833);
                    if (item.productId === 'saponette-artigianali' && saponetteDiscountActive) {
                        const unitFullCents = Math.round((Number(item.pricePerPack) || 0) * 100);
                        const unitDiscCents = Math.round(unitFullCents * (1 - 0.0833));
                        discountedLine = (unitDiscCents * (Number(item.quantity) || 0)) / 100;
                    }
                    goodsTotalNoDiscount += baseLine;
                    goodsTotal += discountedLine;
                    totalJarsInCart += item.totalItemJars;
                });
                let shippingTotal = 0;
                if (isLocalShipping) {
                    shippingTotal = 0;
                } else if (goodsTotal >= 120) {
                    shippingTotal = 0;
                } else {
                    const isSinglePromo10 = detailedCartItems.length === 1 && /10\s*confezion/.test(detailedCartItems[0].packLabel);
                    if (isSinglePromo10) shippingTotal = 8;
                    else shippingTotal = totalJarsInCart >= 3 ? 10 : 8;
                }
                const orderTotal = goodsTotal + shippingTotal;
                window.__shippingEuro = shippingTotal;
return { goodsTotal, goodsTotalNoDiscount, shippingTotal, orderTotal, totalJarsInCart, detailedCartItems };
            }, [cartItems, getCartItemDetails, products, isLocalShipping]);

          return false;
        }

        return true;
      }, [name, email, phone, address, city, cap, province, showNotification]);

<script>
// ===== Reveal on scroll (IntersectionObserver) =====
(function(){
  const prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReduced) return;

  const targets = new Set();

  // Heuristics: mark common content blocks if not already marked
  function autoMark(){
    const candidates = document.querySelectorAll([
      '.rounded-2xl.border',          // most cards/panels
      '.shadow-xl',                   // panels
      'header .rounded-2xl',          // header card
      '#root [className*="grid"] > *'     // grid children
    ].join(','));
    candidates.forEach(el => {
      if (!el.classList.contains('reveal-up') && !el.classList.contains('reveal-fade')) {
        el.classList.add('reveal-up');
      }
      targets.add(el);
    });
  }

  const io = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) entry.target.classList.add('is-visible');
    });
  }, { rootMargin: '0px 0px -10% 0px', threshold: .1 });

  function observeAll(){
    targets.forEach(t => io.observe(t));
  }

  autoMark();
  observeAll();

  // Observe mutations to handle React renders (product detail/cart updates)
  const mo = new MutationObserver(() => {
    autoMark();
    observeAll();
  });
  mo.observe(document.getElementById('root'), { childList:true, subtree:true });
})();

// ===== Mouse parallax for background (updates CSS vars --mx/--my) =====
(function(){
  const root = document.documentElement;
  let raf = null;
  function onMove(e){
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    if (raf) cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      root.style.setProperty('--mx', x + '%');
      root.style.setProperty('--my', y + '%');
    });
  }
  window.addEventListener('mousemove', onMove, { passive:true });
})();

// Handler aggiornato per 'Paga con carta'
async function handlePayWithCard(payload) {
  try {
    const res = await fetch(checkoutApiEndpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    // Leggi il body UNA SOLA VOLTA come testo
    const raw = await res.text();

    if (!res.ok) {
      let msg = raw;
      try { msg = (JSON.parse(raw).error) || raw; } catch (_) {}
      throw new Error(msg || `HTTP ${res.status}`);
    }

    let url = raw;
    try {
      const data = JSON.parse(raw);
      if (data && typeof data.url === 'string') url = data.url;
      else if (data && typeof data.id === 'string') {
        // Se la tua API restituisce un sessionId e usi stripe.js,
        // potresti fare redirectToCheckout qui. Altrimenti serve un URL.
      }
    } catch (_) {
      // raw non è JSON: assumiamo sia un URL text/plain
    }

    if (!url || !/^https?:\/\//i.test(url)) {
      throw new Error('Risposta senza URL valido di checkout.');
    }

    window.location.href = url;
  } catch (err) {

}

<script>
// Auto-reload after Admin logout to avoid transient Firestore permission errors
(function () {
  try {
    var fb = window.firebase;
    if (!fb) return;
    var auth = (typeof fb.getAuth === 'function') ? fb.getAuth() : (fb.auth ? fb.auth() : null);
    if (!auth) return;

    var RELOAD_KEY = '__reloaded_after_logout__';
    var prevUid = null;
    var prevAnon = null;

    function scheduleReload() {
      if (!sessionStorage.getItem(RELOAD_KEY)) {
        sessionStorage.setItem(RELOAD_KEY, '1');
        setTimeout(function(){ location.reload(); }, 120);
      }
    }

    function clearFlagSoon() {
      setTimeout(function(){ sessionStorage.removeItem(RELOAD_KEY); }, 800);
    }

    function handler(user) {
      var currUid = user && user.uid ? user.uid : null;
      var currAnon = !!(user && user.isAnonymous);
      var wasLogged = !!prevUid && (prevAnon === false);
      var isLogged  = !!currUid && (currAnon === false);
      var becameAnonOrNull = wasLogged && !isLogged;
      prevUid = currUid;
      prevAnon = currAnon;

      if (becameAnonOrNull) {
        scheduleReload();
      } else {
        clearFlagSoon();
      }
    }

    if (typeof fb.onAuthStateChanged === 'function' && auth) {
      fb.onAuthStateChanged(auth, handler);
    } else if (auth && typeof auth.onAuthStateChanged === 'function') {
      auth.onAuthStateChanged(handler);
    }
  } catch (e) {
    console.warn('Auto-reload after logout init error:', e);
  }
})();
</script>

<!-- === PATCH: robust handler for "Paga con carta" to avoid extension/popup issues === -->
<script>
(function () {
  "use strict";

  function findPayButton() {
    const byId = document.getElementById('btnCard') || document.getElementById('btn-pay-card');
    if (byId) return byId;
    const nodes = Array.from(document.querySelectorAll('button, a[role="button"], .pay-card-btn, button.pay-card'));
    return nodes.find(n => (n.innerText || n.textContent || '').trim().toLowerCase().includes('paga con carta')) || null;
  }

  async function createCheckoutSession(payload) {
    const res = await fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    let data = {};
    try { data = await res.json(); } catch (_) {}
    if (!res.ok || !data || !data.url) {
      const msg = (data && (data.error || data.message)) || ('HTTP ' + res.status);
      throw new Error('Create session failed: ' + msg);
    }
    return data.url;
  }

  
async function buildPayload(){
  const sleep = (ms) => new Promise(r => setTimeout(r, ms));
  const isSap = it => (it && (it.productId === 'saponette-artigianali' || /saponett/i.test(it.productName || it.name || '')));

  const unitFullCents = 400;
  const unitDiscCents = Math.round(unitFullCents * (1 - (window.SAPONETTE_DISCOUNT_RATE || 0.0833)));

  // Helper to normalize {name, amount, quantity}
  function normalizeItems(items, sapQtyTotalIfUnknown){
    const norm = [];
    let sapQty = 0;
    for (const it of (items || [])){
      if (!it) continue;
      const name = it.name || it.productName || 'Articolo';
      const qty  = Number(it.quantity || it.qty || 0);
      let amount = Number(it.amount || it.pricePerPack || 0);
      if (/saponett/i.test(name)) sapQty += qty;
      if (qty > 0 && amount > 0){
        norm.push({ name, amount, quantity: qty });
      }
    }
    // If amounts are full price for saponette but tot >= 6, force unit discounted
    const tot = sapQtyTotalIfUnknown != null ? sapQtyTotalIfUnknown : sapQty;
    if (tot >= 6){
      for (const it of norm){
        if (/saponett/i.test(it.name)) it.amount = unitDiscCents / 100; // 3.67
      }
    }
    return norm;
  }

  // Try up to ~3s allowing React state to settle
  for (let attempt = 0; attempt < 30; attempt++){
    // 1) Prefer the cart model if present
    if (Array.isArray(window.__cart) && window.__cart.length){
      const cart = window.__cart;
      const sapQtyTot = cart.reduce((n, it)=> n + (isSap(it) ? Number(it?.quantity||0) : 0), 0);
      const items = normalizeItems(cart.map(it => ({
        name: `${it?.productName || it?.name || 'Articolo'}${it?.packLabel ? ' ('+it.packLabel+')' : ''}`,
        amount: Number(it?.pricePerPack || it?.amount || 0),
        quantity: Number(it?.quantity || 0)
      })), sapQtyTot);
      if (items.length){
        return {
          items,
          shipping_cents: Number(window.__shippingCents || 0),
          customer: window.__customer || {},
          email: (window.__customer && window.__customer.email) || undefined,
          notes: typeof window.__orderNotes === 'string' ? window.__orderNotes : undefined
        };
      }
    }
    // 2) Fallback __lineItemsForStripe
    if (Array.isArray(window.__lineItemsForStripe) && window.__lineItemsForStripe.length){
      const li = window.__lineItemsForStripe;
      const sapQty = li.reduce((n, x)=> n + ( /saponett/i.test(x?.name || '') ? Number(x?.quantity||0) : 0 ), 0);
      const items = normalizeItems(li, sapQty);
      if (items.length){
        return {
          items,
          shipping_cents: Number(window.__shippingCents || 0),
          customer: window.__customer || {},
          email: (window.__customer && window.__customer.email) || undefined,
          notes: typeof window.__orderNotes === 'string' ? window.__orderNotes : undefined
        };
      }
    }
    try { document.dispatchEvent(new CustomEvent('checkout:prepare')); } catch(_){}
    await sleep(attempt < 10 ? 60 : 120);
  }
  throw new Error('Carrello non pronto: nessun articolo disponibile.');
}


  function setLoading(btn, on) {
    try {
      if (!btn) return;
      btn.disabled = !!on;
      btn.style.opacity = on ? 0.6 : 1;
      btn.style.pointerEvents = on ? 'none' : 'auto';
    } catch (_) {}
  }

  async function onPayClick(ev) {
    try { ev.preventDefault(); } catch(_) {}
    const btn = ev && ev.currentTarget ? ev.currentTarget : findPayButton();
    try {
      setLoading(btn, true);
      const payload = await buildPayload();
      const url = await createCheckoutSession(payload);
      window.location.assign(url); // same-tab, avoids popup blockers
    } catch (err) {
      console.error('[Checkout] error:', err);
      alert('Pagamento non avviato. Prova la modalità in incognito o ricarica la pagina.\nDettagli: ' + ((err && err.message) ? err.message : err));
    } finally {
      setLoading(btn, false);
    }
  }

  function wirePayButton() {
    const btn = findPayButton();
    if (!btn) return;
    try { btn.onclick = null; } catch(_) {}
    btn.addEventListener('click', onPayClick, { capture: true });
  }

  document.addEventListener('DOMContentLoaded', wirePayButton);
  document.addEventListener('cart:updated', wirePayButton);
})();
</script>

  // Small overlay while preparing
  function showOverlay(){
    let ov = document.getElementById('__pay_overlay__');
    if (!ov){
      ov = document.createElement('div');
      ov.id = '__pay_overlay__';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99999;display:flex;align-items:center;justify-content:center;font:600 16px system-ui;color:#fff';
      ov.innerHTML = '<div style="background:#222;border-radius:12px;padding:18px 20px;box-shadow:0 8px 24px rgba(0,0,0,.4)">Preparazione pagamento…</div>';
      document.body.appendChild(ov);
    }
    ov.style.display = 'flex';
  }
  function hideOverlay(){
    const ov = document.getElementById('__pay_overlay__');
    if (ov) ov.style.display = 'none';
  }

  // Heuristics: is the node inside the checkout panel?
  function isWithinCheckout(el){
    for (let n=el, i=0; n && i<8; n=n.parentElement, i++){
      const txt = (n.innerText || '').toLowerCase();
      if (txt.includes('finalizza il tuo ordine')) return true;
      // presence of typical fields
      if (n.querySelector && (n.querySelector('input[type="email"]') || n.querySelector('input[name*="email" i]'))) return true;
    }
    return false;
  }

  function isPayNode(n){
    if (!n) return false;
    const t = (n.innerText || n.textContent || '').trim().toLowerCase();
    if (!t.includes('paga con carta')) return false;
    return isWithinCheckout(n);
  }

  function findPayButton(){
    const nodes = Array.from(document.querySelectorAll('button, a[role="button"], .btn, .button, [data-action]'));
    for (const n of nodes){ if (isPayNode(n)) return n; }
    return null;
  }

  // Robust async payload builder (cart-first + lineItems; ~6s total)
  if (typeof window.buildPayload !== 'function'){
    window.buildPayload = async function(){
      const sleep = (ms)=>new Promise(r=>setTimeout(r,ms));
      const isSap = it => (it && (it.productId === 'saponette-artigianali' || /saponett/i.test(it.productName || it.name || '')));
      const unitFullCents = 400;
      const unitDiscCents = Math.round(unitFullCents * (1 - (window.SAPONETTE_DISCOUNT_RATE || 0.0833)));

      for (let attempt=0; attempt<50; attempt++){ // up to ~6s
        // 1) CART
        if (Array.isArray(window.__cart) && window.__cart.length){
          const cart = window.__cart;
          const sapQtyTot = cart.reduce((n, it)=> n + (isSap(it)? Number(it?.quantity||0) : 0), 0);
          const discountActive = sapQtyTot >= 6;
          const items = cart.map(it => {
            const qty = Number(it?.quantity||0);
            let amount = Number(it?.pricePerPack || it?.amount || 0);
            if (discountActive && isSap(it)) amount = unitDiscCents / 100; // 3.67
            const name = `${it?.productName || it?.name || 'Articolo'}${it?.packLabel ? ' ('+it.packLabel+')' : ''}`;
            return { name, amount, quantity: qty };
          }).filter(r => r.quantity > 0 && r.amount > 0);
          if (items.length){
            return {
              items,
              shipping_cents: Number(window.__shippingCents || 0),
              customer: window.__customer || {},
              email: (window.__customer && window.__customer.email) || undefined,
              notes: typeof window.__orderNotes === 'string' ? window.__orderNotes : undefined
            };
          }
        }
        // 2) line items
        if (Array.isArray(window.__lineItemsForStripe) && window.__lineItemsForStripe.length){
          const li = window.__lineItemsForStripe;
          const sapQty = li.reduce((n, x)=> n + (/saponett/i.test(x?.name || '') ? Number(x?.quantity||0) : 0), 0);
          const discountActive = sapQty >= 6;
          const items = li.map(x => {
            const qty = Number(x?.quantity||0);
            let amount = Number(x?.amount || 0);
            if (discountActive && /saponett/i.test(x?.name || '')) amount = unitDiscCents / 100;
            return { name: x?.name || 'Articolo', amount, quantity: qty };
          }).filter(r => r.quantity > 0 && r.amount > 0);
          if (items.length){
            return {
              items,
              shipping_cents: Number(window.__shippingCents || 0),
              customer: window.__customer || {},
              email: (window.__customer && window.__customer.email) || undefined,
              notes: typeof window.__orderNotes === 'string' ? window.__orderNotes : undefined
            };
          }
        }
        try { document.dispatchEvent(new CustomEvent('checkout:prepare')); } catch(_){}
        await sleep(120);
      }
      throw new Error('Carrello non pronto: aggiungi almeno un prodotto.');
    };
  }

  // Single-flight guard
  if (typeof window.__checkoutInFlight === 'undefined') window.__checkoutInFlight = false;

  async function startCheckout(ev){
    try {
      if (window.__checkoutInFlight) { ev && ev.preventDefault && ev.preventDefault(); return; }
      const btn = (ev && (ev.currentTarget || ev.target)) || findPayButton();
      if (!btn || !isPayNode(btn)) return; // ignore clicks fuori dal checkout
      ev && ev.preventDefault && ev.preventDefault();
      ev && ev.stopPropagation && ev.stopPropagation();
      ev && ev.stopImmediatePropagation && ev.stopImmediatePropagation();

      window.__checkoutInFlight = true;
      if (btn){ try{ btn.disabled = true; btn.style.opacity = .6; }catch(_){ } }
      showOverlay();

      const payload = await buildPayload();
      const res = await fetch('/api/create-checkout-session', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      let data = {}; try { data = await res.json(); } catch(_){}
      if (!res.ok || !data || !data.url) throw new Error((data && (data.error || data.message)) || ('HTTP '+res.status));
      window.location.assign(data.url);
    } catch (err){
  console.error('[Checkout] error:', err);
  alert('Pagamento non avviato. Riprova.\nDettagli: ' + ((err && err.message) ? err.message : err));
    } finally {
      window.__checkoutInFlight = false;
      hideOverlay();
      const b = findPayButton();
      if (b){ try{ b.disabled = false; b.style.opacity = 1; }catch(_){ } }
    }
  }

  // Delegated listeners (capture + bubble) restricted to checkout button
  document.addEventListener('click', function(e){
    for (let n=e.target, i=0; n && i<8; n=n.parentElement, i++){
      if (isPayNode(n)){ startCheckout(e); return; }
    }
  }, true);
  document.addEventListener('click', function(e){
    for (let n=e.target, i=0; n && i<8; n=n.parentElement, i++){
      if (isPayNode(n)){ startCheckout(e); return; }
    }
  }, false);
  document.addEventListener('submit', function(e){
    const b = findPayButton();
    if (b && (b.form === e.target || e.target.contains(b))) startCheckout(e);
  }, true);

  // Observer to re-scan if React re-renders
  const mo = new MutationObserver(()=>{ findPayButton(); });
  mo.observe(document.documentElement || document.body, {childList:true,subtree:true});
})();
</script>

<!-- FISSA la spedizione letta dalla pagina (8€ / 10€) prima del checkout -->
<script>
(function(){
  function parseEuroToCents(s){
    if(!s) return NaN;
    s = String(s).toLowerCase().replace(/€/g,'').replace(/eur/g,'').replace(/\s+/g,'');
    s = s.replace(/\./g,'').replace(',', '.');  // 10,00 -> 10.00
    var n = Number(s);
    return Number.isFinite(n) ? Math.round(n*100) : NaN;
  }
  var cents = NaN;

  // 1) trova una riga con "Spedizione €..."
  var nodes = Array.from(document.querySelectorAll('body *'));
  for (var i=0;i<nodes.length && i<2000;i++){
    var el = nodes[i];
    var t = (el.textContent || '').trim();
    if (/spedizion/i.test(t) && /€\s*\d/.test(t)) {
      var m = t.match(/€\s*[\d\.,]+/i);
      if (m && m[0]) {
        cents = parseEuroToCents(m[0]);
        if (Number.isFinite(cents)) break;
      }
    }
  }
  // 2) fallback: #shipping-amount
  if (!Number.isFinite(cents)){
    var elAmt = document.querySelector('#shipping-amount');
    if (elAmt) cents = parseEuroToCents(elAmt.textContent);
  }
  if (Number.isFinite(cents)){
    window.__shippingCents = cents;
    console.log('[SHIPPING] dal DOM:', window.__shippingCents, 'cents');
  }
})();
</script>

<script id="promo-ship-logic-js">
(function(){
  function textOf(el){
    let txt = (el.textContent||"");
    // include alt and aria-label attributes within scope
    el.querySelectorAll("[alt],[aria-label],[data-product-id],[data-name]").forEach(n=>{
      if(n.getAttribute("alt")) txt += " " + n.getAttribute("alt");
      if(n.getAttribute("aria-label")) txt += " " + n.getAttribute("aria-label");
      if(n.getAttribute("data-product-id")) txt += " " + n.getAttribute("data-product-id");
      if(n.getAttribute("data-name")) txt += " " + n.getAttribute("data-name");
    });
    return txt;
  }

  function isVegOrChew(scopeText){
    const t = scopeText.toLowerCase();
    const isVeg = t.includes("vegetelle");
    const isChew = t.includes("chewing") || t.includes("chewing-gum") || /gomme\s+da\s+masticare/i.test(t);
    const isOrs = /orsett/i.test(t); // orsetti/orsetto
    return (isVeg || isChew) && !isOrs;
  }

  function enhancePromoLabels(){
    // scan all pack buttons
    document.querySelectorAll('button').forEach(btn=>{
      const btnText = (btn.textContent||"").replace(/\s+/g," ").toLowerCase();
      if(!/10\s*confezion/.test(btnText)) return; // only "10 confezioni" packs

      // determine product scope
      let scope = btn.closest('[data-product-id], section, article, .product, .card') || document.body;
      const scopeText = textOf(scope);

      if(!isVegOrChew(scopeText)) return; // ONLY vegetelle or chewing gum

      // find "Spedizione:" label inside the button and replace amount with PROMO €8 badge
      const line = [...btn.querySelectorAll("div,span,p,small")].find(el => /Spedizione\s*:/i.test((el.textContent||"")));
      if(!line || line.dataset.promoShip === "1") return;

      line.dataset.promoShip = "1";
      const current = (line.textContent||"");
      line.innerHTML = current.replace(/(Spedizione\s*:)\s*€\s*\d+[.,]?\d*/i, '$1 <span class="promo-ship-badge">PROMO €8</span>');
    });
  }

  document.addEventListener("DOMContentLoaded", enhancePromoLabels);
  window.addEventListener("load", enhancePromoLabels);
  new MutationObserver(enhancePromoLabels).observe(document.documentElement, {subtree:true, childList:true, characterData:true});
})();
</script>

<!-- === LOCAL SHIPPING (vDIST-Stripe-like, inline) === -->
<script>
(function(){
  "use strict";
  window.__LOCAL_SHIP_VER = "vDIST-StripeLike";

  // Oasi del Busatello (env lato server usa le stesse)
  const ORIGIN = { lat: 45.1076, lon: 11.1522 };
  const MAX_KM = 50;

  // Haversine in km
  function distKm(aLat, aLon, bLat, bLon){
    const toRad = d => d * Math.PI/180, R=6371;
    const dLat = toRad(bLat-aLat), dLon = toRad(bLon-aLon);
    const s1 = Math.sin(dLat/2), s2 = Math.sin(dLon/2);
    const a = s1*s1 + Math.cos(toRad(aLat))*Math.cos(toRad(bLat))*s2*s2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  // Geocoding come nel backend (Nominatim). NB: rispetto dei limiti → 1 richiesta / input stabilizzato (debounce)
  async function geocodeAddress(addr){
    const country = addr.country || "IT";
    const chunks = [addr.line1, addr.city, addr.state, addr.postal_code, country].filter(Boolean);
    const q = chunks.join(", ");
    const ua = "AltheaShop-Frontend/1.0 (info@oasi-busatello.example)";
    try{
      let url = "https://nominatim.openstreetmap.org/search?format=json&limit=1&addressdetails=1&q=" + encodeURIComponent(q);
      let r = await fetch(url, { headers: { "User-Agent": ua, "Accept-Language": "it" } });
      if (r.ok){
        let js = await r.json();
        if (Array.isArray(js) && js.length) return { lat:+js[0].lat, lon:+js[0].lon, source:"address" };
      }
      if (addr.postal_code){
        let url2 = "https://nominatim.openstreetmap.org/search?format=json&limit=1&country=" + encodeURIComponent(country) + "&postalcode=" + encodeURIComponent(addr.postal_code);
        let r2 = await fetch(url2, { headers: { "User-Agent": ua, "Accept-Language": "it" } });
        if (r2.ok){
          let js2 = await r2.json();
          if (Array.isArray(js2) && js2.length) return { lat:+js2[0].lat, lon:+js2[0].lon, source:"postal_code" };
        }
      }
    }catch(e){
      console.warn("[vDIST] geocode error:", e);
    }
    return null;
  }

  // Fallback CAP (VR/MN) se geocoding non disponibile
  const isCAP_MN = c => /^460\d{2}$/.test(c) || c === "46100";
  const isCAP_VR = c => /^37\d{3}$/.test(c);
  const eligibleByCAP = c => isCAP_MN(c) || isCAP_VR(c);

  function queryScope(){
    const box = [...document.querySelectorAll('*')].find(n => /Finalizza il tuo Ordine/i.test(n.textContent||''));
    return box?.closest('section,div,form') || document;
  }
  function findFields(scope){
    return {
      adr:  scope.querySelector('input[placeholder*="Indirizzo"], input[name*="indirizzo" i]'),
      city: scope.querySelector('input[placeholder*="Città"], input[name*="citta" i], input[name*="comune" i]'),
      cap:  scope.querySelector('input[placeholder*="CAP"], input[name*="cap" i]'),
      prov: scope.querySelector('select[placeholder*="Provincia"], select[name*="prov" i], select[aria-label*="Provincia" i]'),
    };
  }

  function bindWhenReady(){
    const scope = queryScope();
    let { adr, city, cap, prov } = findFields(scope);
    if (adr && city && cap){ setup(adr, city, cap, prov); return; }
    const obs = new MutationObserver(() => {
      ({ adr, city, cap, prov } = findFields(scope));
      if (adr && city && cap){ obs.disconnect(); setup(adr, city, cap, prov); }
    });
    obs.observe(document.documentElement, { childList:true, subtree:true });
    setTimeout(() => obs.disconnect(), 15000);
  }

  function setup(adr, city, cap, prov){
    let t, lastQuery = "";
    async function recalc(){
      const aOk = !!(adr.value||'').trim();
      const cOk = !!(city.value||'').trim();
      const capVal = (cap.value||'').trim();
      const pOk = /^\d{5}$/.test(capVal);
      if (!(aOk && cOk && pOk)) { window.setLocalShippingFree(false); return; }

      const province = (prov && (prov.value || prov.selectedOptions?.[0]?.text) || '').trim();
      const payload = { line1: adr.value.trim(), city: city.value.trim(), state: province, postal_code: capVal, country: "IT" };
      const key = JSON.stringify(payload);
      if (key === lastQuery) return; // evita richieste duplicate
      lastQuery = key;

      // 1) prova distanza vera via geocoding
      const geo = await geocodeAddress(payload);
      if (geo){
        const km = distKm(ORIGIN.lat, ORIGIN.lon, geo.lat, geo.lon);
        const eligible = km <= MAX_KM;
        window.setLocalShippingFree(eligible);
        return;
      }
      // 2) fallback CAP
      window.setLocalShippingFree(eligibleByCAP(capVal));
    }
    function schedule(){ clearTimeout(t); t = setTimeout(recalc, 400); }

    // Esponi ricontrollo manuale se serve
    window.recalcLocalShipping = recalc;

    adr.addEventListener('input', schedule);
    city.addEventListener('input', schedule);
    cap.addEventListener('input', schedule);
    if (prov){ prov.addEventListener('input', schedule); prov.addEventListener('change', schedule); }

    schedule();
    console.log('[LocalShipping] vDIST-StripeLike bound');
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bindWhenReady);
  else bindWhenReady();
})();
</script>

      g.style.justifyContent = 'center';

      g.style.gridTemplateColumns = 'repeat(auto-fit, minmax(20px, 1fr))';
    });
  }
  applyGrid();
  window.addEventListener('resize', applyGrid);
  // 2) SUBTITLES: nascondi/rimuovi testi bianchi ogni volta che il DOM cambia (Firebase hydration)
  const hide = () => {
    document.querySelectorAll(
      '[data-category] p, [data-category] small, ' +
      '[data-category] .subtitle, [data-category] .category-subtitle, ' +
      '[data-category] .text-white, [data-category] .text-stone-50, [data-category] .text-stone-100, [data-category] .text-stone-200, ' +
      '[data-category] .text-gray-50, [data-category] .text-gray-100, [data-category] .text-gray-200'
    ).forEach(function(el){ el.style.display='none'; el.style.visibility='hidden'; });
  };
  hide();
  new MutationObserver(function(){ hide(); applyGrid(); }).observe(document.body, {subtree:true, childList:true});
})();
</script>

<!-- enforce shippingCostOverride (EURO) for backend compatibility -->
<script>
(() => {
  const _fetch = window.fetch;
  window.fetch = function(input, init){
    try{
      const url = typeof input === 'string' ? input : (input && input.url) || '';
      const isPOST = init && String(init.method||'').toUpperCase()==='POST';
      if (/\/api\/create-checkout-session/i.test(url) && isPOST && typeof init.body === 'string'){
        const p = JSON.parse(init.body || '{}');
        // Sorgente unica: shipping in EURO dal calcolo React
        if (typeof window.__shippingEuro === 'number') {
          p.shippingCostOverride = Math.round((window.__shippingEuro + Number.EPSILON) * 100) / 100; // 8 -> 8, 10 -> 10
        } else if (typeof p.shipping_cents === 'number') {
          p.shippingCostOverride = Math.round((p.shipping_cents / 100 + Number.EPSILON) * 100) / 100;
        } else if (typeof p.shipping_total === 'number') {
          p.shippingCostOverride = p.shipping_total;
        }
        // Pulizia dei campi legacy che creano doppie conversioni
        delete p.shipping_cents;
        delete p.shipping_total;
        delete p.shipping_label;
        init.body = JSON.stringify(p);
        console.debug('[override] shippingCostOverride =', p.shippingCostOverride);
      }
    }catch(e){}
    return _fetch.apply(this, arguments);
  };
})();
</script>

<script>
/* === Validazione CAP vs Paese per bloccare il checkout === */
(function(){
  // cerca un valore leggendo più selettori possibili
  function readField(/* ...selectors */){
    for (const sel of arguments){
      const el = document.querySelector(sel);
      if (el && typeof el.value === 'string' && el.value.trim() !== '') {
        return el.value.trim();
      }
    }
    return '';
  }

  // mappa regex per Paese
  function validatePostalVsCountry(countryRaw, postalRaw){
    const patterns = {
      IT: /^\d{5}$/,
      FR: /^\d{5}$/,
      DE: /^\d{5}$/,
      ES: /^\d{5}$/,
      US: /^\d{5}(-\d{4})?$/,
      GB: /^([A-Z]{1,2}\d[A-Z\d]?\s?\d[A-Z]{2})$/i,
      default: /^.{3,}$/
    };
    const country2 = (countryRaw || '').toUpperCase().trim();
    // normalizza: “Italia” → “IT”, “France” → “FR” (primi 2 char)
    const iso = country2.length >= 2 ? country2.slice(0,2) : country2;
    const re = patterns[iso] || patterns.default;
    return re.test((postalRaw || '').trim());
  }

  // patcha la funzione di checkout se esiste
  const _origBind = Function.prototype.bind;
  // trova la funzione quando viene definita in window (fallback robusto)
  const hook = () => {
    try {
      const fn = window.handleStripePayment || window.payWithCard || window.startCheckout;
      if (!fn || fn.__capGuardPatched) return;

      const wrapped = async function(...args){
        // leggi Paese e CAP
        const country = readField('#country','#shipping-country','[name="country"]','[name*="country" i]');
        const postal  = readField('#cap','#zip','#postal','#postalCode','#shipping-zip','[name*="postal" i]','[name*="cap" i]','[name*="zip" i]');

        if (country && postal && !validatePostalVsCountry(country, postal)){
          // mostra messaggio e blocca
          alert('Controlla CAP e Paese: non corrispondono. Correggi per procedere al pagamento.');
          return; // STOP: non chiamare fetch/Stripe
        }
        // altrimenti prosegui come prima
        return await fn.apply(this, args);
      };
      wrapped.__capGuardPatched = true;
      // sostituisci la funzione globale
      if (window.handleStripePayment) window.handleStripePayment = wrapped;
      if (window.payWithCard)       window.payWithCard       = wrapped;
      if (window.startCheckout)     window.startCheckout     = wrapped;
    } catch(e){}
  };

  // tenta più volte finché la funzione non è caricata
  let tries = 0;
  const iv = setInterval(()=>{
    hook();
    if (++tries > 50) clearInterval(iv); // smetti dopo ~5s
  }, 100);
  document.addEventListener('DOMContentLoaded', hook);
})();
</script>


<!-- Shipping auto-recalc patch (keeps shipping correct after returning from Stripe/back cache) -->
<script id="shipping-recalc-patch">
(function(){
  try{ if (window.__shippingPatchInstalled) return; window.__shippingPatchInstalled = true; }catch(e){}
  var SHIPPING = {
    FREE_THRESHOLD: 120,
    LOCAL_CAP: ["37063","37050","37068","37069","46010","46020"]
  };
  function pickShipping(ctx){
    var t = Math.round((Number(ctx && ctx.total) || 0) * 100) / 100;
    var cap = (ctx && ctx.cap ? String(ctx.cap) : "");
    if (t >= SHIPPING.FREE_THRESHOLD) return { id:"free", label:"Spedizione gratuita", cost:0 };
    if (cap && SHIPPING.LOCAL_CAP.some(function(c){ return cap.startsWith(c); })) return { id:"local", label:"Consegna locale", cost:0 };
    return { id:"courier", label:"Corriere", cost:6.90 };
  }
  function getCartTotal(){
    try{
      var cart = JSON.parse(localStorage.getItem("cart") || "[]");
      if (!Array.isArray(cart)) return 0;
      return cart.reduce(function(sum,p){
        var price = Number(p && p.price) || 0;
        var qty   = Number(p && p.qty)   || 0;
        return sum + price * qty;
      }, 0);
    }catch(e){ return 0; }
  }
  function getCap(){ try{ return (localStorage.getItem("cap") || "").trim(); }catch(e){ return ""; } }
  function applyShipping(){
    var method = pickShipping({ total:getCartTotal(), cap:getCap() });
    try{ sessionStorage.setItem("shippingMethod", JSON.stringify(method)); }catch(e){}
    try{ window.dispatchEvent(new CustomEvent("shipping:updated", { detail: method })); }catch(e){}
  }
  // initial
  applyShipping();
  // on navigation/visibility/storage
  window.addEventListener("pageshow", function(){ applyShipping(); });
  window.addEventListener("focus", function(){ applyShipping(); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) applyShipping(); });
  window.addEventListener("popstate", function(){ applyShipping(); });
  window.addEventListener("storage", function(e){ if (e && (e.key==="cart" || e.key==="cap")) applyShipping(); });
  // return from Stripe (?success / ?canceled)
  if (location.search.indexOf("success") !== -1 || location.search.indexOf("canceled") !== -1) { applyShipping(); }
})();
</script>




<script id="bacheca-in-category">
(() => {
  const PANEL_HTML = `
    <div id="bacheca-panel" style="margin:22px 0 0;">
      <div style="background:#121212;border:1px solid rgba(255,255,255,.06);border-radius:20px;padding:22px">
        <div style="display:inline-block;font-size:12px;font-weight:800;letter-spacing:.02em;color:#cbd5e1;background:rgba(148,163,184,.14);border:1px solid rgba(148,163,184,.25);padding:6px 10px;border-radius:999px;margin-bottom:10px">
          LA BACHECA DE L' ITALIANO
        </div>
        <h2 style="margin:0 0 8px;font-size:32px;font-weight:800">Area community in arrivo</h2>
        <p style="color:#d1d5db;margin:0 0 16px">Presto qui troverai contenuti utili per la community:</p>
        <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:16px 0">
          <div style="display:flex;align-items:center;gap:10px;background:#0f0f0f;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 14px color:#e5e7eb;">
            <span style="width:8px;height:8px;border-radius:50%;background:#fbbf24;display:inline-block"></span><span style="color:#fff">Annunci e novità dai produttori</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;background:#0f0f0f;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 14px color:#e5e7eb;">
            <span style="width:8px;height:8px;border-radius:50%;background:#fbbf24;display:inline-block"></span><span style="color:#fff">Offerte ed eventi</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;background:#0f0f0f;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 14px color:#e5e7eb;">
            <span style="width:8px;height:8px;border-radius:50%;background:#fbbf24;display:inline-block"></span><span style="color:#fff">Collaborazioni e contatti</span>
          </div>
          <div style="display:flex;align-items:center;gap:10px;background:#0f0f0f;border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:12px 14px color:#e5e7eb;">
            <span style="width:8px;height:8px;border-radius:50%;background:#fbbf24;display:inline-block"></span><span style="color:#fff">Guide pratiche e FAQ</span>
          </div>
        </div>
        <div><button type="button" id="bacheca-back" style="display:inline-block;background:#f59e0b;color:#111;font-weight:700;padding:10px 14px;border-radius:12px;border:0;cursor:pointer">← Torna alle categorie</button></div>
      </div>
    </div>`;

  const getPanel = () => document.getElementById('bacheca-panel');
  const removePanel = () => { const p = getPanel(); if (p && p.parentNode) p.parentNode.removeChild(p); };

  // True when we're on categories grid (heuristic: 6+ cards and NO "Selezione" heading)
  function isCategoriesView(){
    const hasSelectionHeading = !!Array.from(document.querySelectorAll('h1,h2')).find(h=>/selezione/i.test(h.textContent||''));
    const cards = document.querySelectorAll('.category-card, .card[data-category], [data-category].category-card');
    return !hasSelectionHeading && cards && cards.length >= 6;
  }

  // Mount panel below the Selezione heading
  function mountInsideSelection(){
    if (getPanel()) return true;
    const heading = Array.from(document.querySelectorAll('h1,h2')).find(el => /selezione/i.test(el.textContent||''));
    if (!heading) return false;
    heading.insertAdjacentHTML('afterend', PANEL_HTML);
    const back = document.getElementById('bacheca-back');
    if (back){
      back.addEventListener('click', () => {
        // remove panel FIRST, then trigger native back
        removePanel();
        const nativeBack = Array.from(document.querySelectorAll('a,button')).find(el => /torna alle categorie/i.test(el.textContent||''));
        if (nativeBack) nativeBack.click(); else history.back();
      });
    }
    return true;
  }

  // Click handling
  document.addEventListener('click', (e) => {
    const n = e.target.closest('a, .card, .category-card, [data-category]');
    if (!n) return;
    const txt = (n.textContent || '').toLowerCase();
    const isBack = txt.includes('torna alle categorie');
    const isBacheca = txt.includes('bacheca');

    if (isBack){
      // remove immediately on any back
      removePanel();
      return;
    }
    if (isBacheca){
      // mount after app renders the selection view
      setTimeout(() => {
        if (!mountInsideSelection()){
          const obs = new MutationObserver(() => { if (mountInsideSelection()){ obs.disconnect(); }});
          obs.observe(document.body, {childList:true, subtree:true});
          setTimeout(()=>{ try{obs.disconnect();}catch(_){}} , 2000);
        }
      }, 0);
    }
  }, {passive:true});

  // Global watchdog: if categories grid becomes visible, ensure panel is gone
  const watchdog = new MutationObserver(() => {
    if (isCategoriesView()) removePanel();
  });
  window.addEventListener('load', () => {
    if (isCategoriesView()) removePanel();
    watchdog.observe(document.body, {childList:true, subtree:true});
  });
  // Long-running enough to catch UI changes; still auto-stop after 15s to be lightweight
  setTimeout(()=>{ try{watchdog.disconnect();}catch(_){}} , 15000);
})();
</script>
