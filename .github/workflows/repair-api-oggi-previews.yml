name: Repair Api Oggi multilingual previews
on:
  push:
    branches: [main]
    paths:
      - 'scripts/repair_api_oggi_previews.py'
      - '.github/workflows/repair-api-oggi-previews.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check pymupdf pillow langdetect
      - name: Validate PDFs and rebuild previews
        run: python scripts/repair_api_oggi_previews.py
      - name: Commit repaired previews
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add images/api-oggi-01-preview-*.webp
          if git diff --cached --quiet; then
            echo "No preview changes"
            exit 0
          fi
          git commit -m 'Rigenera preview multilingua Il mondo delle api oggi dai PDF corretti'
          git pull --rebase origin main
          git push origin main
