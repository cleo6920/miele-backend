<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pagamento annullato · La Fabbrica delle Api</title>
<style>
:root{--forest:#0b3025;--cream:#f4efe4;--paper:#fffaf1;--gold:#dda52e;--ink:#13231c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#0b3025,#143e31 48%,#f4efe4 48.2%);font-family:Arial,Helvetica,sans-serif;color:var(--ink);padding:22px}
.card{width:min(680px,100%);background:var(--paper);border-radius:30px;padding:36px;box-shadow:0 28px 80px rgba(0,0,0,.28);text-align:center}
.bee{font-size:58px}h1{font-family:Georgia,'Times New Roman',serif;font-size:clamp(36px,7vw,56px);line-height:1;margin:10px 0 16px}p{font-size:17px;color:#5f6a64}
.note{background:#fff0b8;color:#604b13;border-radius:18px;padding:16px;margin:22px auto;max-width:560px;font-weight:800}
a{display:inline-block;background:var(--forest);color:#fff;text-decoration:none;border-radius:999px;padding:14px 20px;font-weight:900}
</style></head><body><main class="card"><div class="bee">🐝</div><h1 id="title">Pagamento annullato</h1><p id="text">Nessun addebito è stato completato.</p><div class="note" id="note">Il tuo carrello è stato conservato: puoi tornare allo shop e riprovare quando vuoi.</div><a href="/shop" id="back">Torna allo shop</a></main>
<script>
const t={it:['Pagamento annullato','Nessun addebito è stato completato.','Il tuo carrello è stato conservato: puoi tornare allo shop e riprovare quando vuoi.','Torna allo shop'],en:['Payment cancelled','No charge was completed.','Your cart has been kept: you can return to the shop and try again whenever you want.','Back to shop'],de:['Zahlung abgebrochen','Es wurde keine Zahlung abgeschlossen.','Dein Warenkorb wurde gespeichert: Du kannst zum Shop zurückkehren und es erneut versuchen.','Zurück zum Shop'],fr:['Paiement annulé','Aucun débit n’a été effectué.','Votre panier a été conservé : vous pouvez revenir à la boutique et réessayer quand vous le souhaitez.','Retour à la boutique'],es:['Pago cancelado','No se ha realizado ningún cargo.','Tu carrito se ha conservado: puedes volver a la tienda e intentarlo de nuevo cuando quieras.','Volver a la tienda']};
let l='it';try{const x=localStorage.getItem('fda-site-language');if(t[x])l=x}catch(_){}
const x=t[l];document.getElementById('title').textContent=x[0];document.getElementById('text').textContent=x[1];document.getElementById('note').textContent=x[2];document.getElementById('back').textContent=x[3];

(async()=>{
  try{
    const raw=localStorage.getItem('fda-production-pending-order');
    if(!raw)return;
    const order=JSON.parse(raw);
    if(!order||!order.id)return;
    const marker='fda-cancel-notified-'+String(order.id);
    if(localStorage.getItem(marker)==='1')return;
    const qs=new URLSearchParams(location.search);
    const reason=qs.get('xpay')||'annullato';
    const r=await fetch('/api/order-cancel-notification',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({...order,cancelReason:reason})
    });
    const d=await r.json().catch(()=>null);
    if(r.ok&&d?.ok)localStorage.setItem(marker,'1');
  }catch(_){}
})();
</script><script src="/render-language-de-test.js?v=20260923-10"></script>
</body></html>
